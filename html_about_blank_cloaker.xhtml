<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML About:Blank Opener</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    input {
      font-size: 16px;
      margin-top: 12px;
    }

    button {
      display: block;
      margin-top: 15px;
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    button:hover {
      background: #555;
    }

    #status {
      margin-top: 15px;
      color: #555;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>HTML About:Blank Opener</h1>
    <p>Choose an HTML file, then open it in a new <code>about:blank</code> tab.</p>

    <input id="file" type="file" accept=".html,.htm,text/html" />

    <button id="open" type="button">Open in about:blank</button>

    <div id="status">No HTML file selected.</div>
  </div>

  <script type="text/javascript">
    //<![CDATA[
    (function () {
      var fileInput = document.getElementById("file");
      var openButton = document.getElementById("open");
      var status = document.getElementById("status");
      var selectedFile = null;

      fileInput.addEventListener("change", function () {
        selectedFile = fileInput.files[0] || null;

        if (selectedFile) {
          status.textContent = "Selected: " + selectedFile.name;
        } else {
          status.textContent = "No HTML file selected.";
        }
      });

      openButton.addEventListener("click", function () {
        if (!selectedFile) {
          status.textContent = "Choose an HTML file first.";
          return;
        }

        var reader = new FileReader();

        reader.onload = function () {
          var newTab = window.open("about:blank", "_blank");

          if (!newTab) {
            status.textContent =
              "The new tab was blocked. Allow pop-ups and try again.";
            return;
          }

          newTab.document.open();
          newTab.document.write(reader.result);
          newTab.document.close();

          status.textContent =
            "Opened " + selectedFile.name + " in about:blank.";
        };

        reader.onerror = function () {
          status.textContent = "Could not read the selected HTML file.";
        };

        reader.readAsText(selectedFile);
      });
    })();
    //]]>
  </script>
</body>
</html>
